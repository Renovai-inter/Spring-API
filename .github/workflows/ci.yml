name: QA + Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  qa:
    name: Quality Assurance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Rodar testes
        run: mvn -B test

  build:
    name: Build do projeto
    needs: qa
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build do JAR
        run: mvn -B -DskipTests clean package

      - name: Upload do artifact
        uses: actions/upload-artifact@v4
        with:
          name: renovai-api-jar
          path: target/*.jar

  docker-build:
    name: Build da imagem Docker
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Build da imagem Docker
        run: docker build -f orchestration/Dockerfile -t renovai-api:ci .
