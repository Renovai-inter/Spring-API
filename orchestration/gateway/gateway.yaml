apiVersion: v1
kind: Namespace
metadata:
  name: renovai-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: renovai-gateway
  namespace: renovai-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: renovai-gateway
  template:
    metadata:
      labels:
        app: renovai-gateway
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginx:stable-alpine
          command: [nginx, -g, "daemon off;"]
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: temporary
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /gateway-health
              port: http
          livenessProbe:
            httpGet:
              path: /gateway-health
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: renovai-gateway-config
        - name: temporary
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: renovai-gateway
  namespace: renovai-api
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-internal: "false"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-protocol: http
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-path: /gateway-health
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-port: traffic-port
spec:
  type: LoadBalancer
  selector:
    app: renovai-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
