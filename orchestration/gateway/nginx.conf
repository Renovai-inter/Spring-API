worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    access_log /dev/stdout;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    resolver ${DNS_RESOLVER} valid=10s ipv6=off;
    resolver_timeout 5s;
    map $uri $backend {
        ~^/api(/|$) springboot-service.renovai-api.svc.cluster.local;
        ~^/rotas(/|$) redis-api-service.renovai-api.svc.cluster.local;
        default ia-api-service.renovai-api.svc.cluster.local;
    }
    server {
        listen 8080;
        client_max_body_size 10m;
        location = /gateway-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
        location / {
            proxy_pass http://$backend:80$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto ${PUBLIC_SCHEME};
            proxy_set_header X-Forwarded-Port ${PUBLIC_PORT};
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_buffering off;
            proxy_next_upstream off;
            proxy_redirect off;
        }
    }
}
