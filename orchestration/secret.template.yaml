apiVersion: v1
kind: Secret
metadata:
  name: springboot-secrets
  namespace: renovai-api
type: Opaque
stringData:
  SPRING_DATASOURCE_URL: "url do banco"
  SPRING_DATASOURCE_USERNAME: "usuario do banco"
  SPRING_DATASOURCE_PASSWORD: "senha do banco"
  JWT_SECRET: "32-chars"
  JWT_EXPIRATION: "86400000"
  SERVER_SERVLET_CONTEXT_PATH: "/api"
  # Login com Google: "ID do cliente da Web" do projeto Firebase (renovai-23544)
  GOOGLE_CLIENT_ID: "xxxxxxxx.apps.googleusercontent.com"
  # E-mail do código de redefinição de senha (Gmail com senha de app)
  MAIL_USERNAME: "renovai.suporte@gmail.com"
  MAIL_PASSWORD: "senha de app (16 letras) gerada em renovai.suporte@gmail.com"
  MAIL_FROM_NAME: "Renovaí"
